
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Marshal Simulator</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .simulator-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .stats {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }

        .stats > div {
            min-width: 100px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            background: #172333;
            color: white;
        }

        .stats strong,
        .stats span {
            display: block;
            margin: 5px;
        }

        .aircraft {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px 15px;
            max-width: 560px;
            margin: 25px auto;
            padding: 35px;
            background: #d7dce2;
            border-radius: 90px;
            color: white;
        }

        .passenger,
        .crew,
        .marshal {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 55px;
            border-radius: 8px;
            font-weight: bold;
        }

        .passenger {
            background: #1264a3;
            cursor: pointer;
        }

        .passenger:hover {
            background: #0c4c7e;
        }

        .crew {
            background: #23733a;
        }

        .marshal {
            grid-column: span 2;
            background: #a72c2c;
        }

        #scenario {
            max-width: 650px;
            margin: 25px auto;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            background: #111c29;
            color: white;
        }

        #scenario button {
            margin: 7px;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #1676bd;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #scenario button:hover {
            background: #0d568d;
        }

        #scenario button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #responseFeedback {
            padding: 20px;
            margin-top: 15px;
            text-align: left;
            background: #1d2a38;
            border-left: 5px solid #2196f3;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        #responseFeedback h3 {
            margin-top: 0;
        }

        #responseFeedback p {
            line-height: 1.6;
        }

        #feedbackTitle.correct {
            color: #58d68d;
        }

        #feedbackTitle.incorrect {
            color: #ff8585;
        }

        #saveStatus {
            font-size: 13px;
            color: #c3d1df;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .simulator-container {
                padding: 10px;
            }

            .aircraft {
                gap: 10px;
                padding: 20px;
                border-radius: 45px;
            }

            .passenger,
            .crew,
            .marshal {
                min-height: 45px;
                font-size: 12px;
            }

            #scenario {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <main class="simulator-container">
        <h1>Virtual Aircraft Simulator</h1>
        <p id="welcome"></p>

        <div class="stats">
            <div>
                <strong>Score</strong>
                <span id="score">0</span>
            </div>

            <div>
                <strong>Scenario</strong>
                <span id="scenarioNumber">1 / 5</span>
            </div>

            <div>
                <strong>Time</strong>
                <span><span id="timer">30</span>s</span>
            </div>
        </div>

        <section class="aircraft" aria-label="Virtual aircraft cabin">
            <button class="passenger" onclick="selectPassenger(1)">P1</button>
            <button class="passenger" onclick="selectPassenger(2)">P2</button>
            <button class="passenger" onclick="selectPassenger(3)">P3</button>
            <button class="passenger" onclick="selectPassenger(4)">P4</button>
            <button class="passenger" onclick="selectPassenger(5)">P5</button>
            <button class="passenger" onclick="selectPassenger(6)">P6</button>
            <div class="crew">CREW</div>
            <div class="marshal">SKY MARSHAL</div>
        </section>

        <section id="scenario" aria-live="polite">
            <h2>Ready to Begin?</h2>
            <p>Select a passenger to start your first training scenario.</p>
        </section>
    </main>

    <script>
        "use strict";

        const API_BASE =
            "https://sky-marshal-backend.onrender.com/api";

        const username =
            localStorage.getItem("username") || "Guest";

        document.getElementById("welcome").textContent =
            "Welcome, " + username;

        let score = 0;
        let timeLeft = 30;
        let timerInterval = null;
        let currentScenario = null;
        let sessionScenarios = [];
        let completedScenarios = 0;
        let correctAnswers = 0;
        let totalResponseTime = 0;
        let scenarioStartTime = 0;
        let responseInProgress = false;
        let scenarioActive = false;

        const scenarios = [
            {
                id: "1",
                description:
                    "A passenger repeatedly looks around the cabin and behaves unusually.",
                correct: "observe",
                explanation:
                    "The expected response is to observe and assess the situation carefully. Unusual behavior alone does not prove wrongdoing."
            },
            {
                id: "2",
                description:
                    "A passenger reports unusual behavior by another passenger.",
                correct: "report",
                explanation:
                    "The expected response is to communicate the report to the cabin crew for appropriate assessment."
            },
            {
                id: "3",
                description:
                    "A passenger appears nervous and repeatedly checks their surroundings.",
                correct: "observe",
                explanation:
                    "The expected response is to observe the situation without making assumptions based only on nervous behavior."
            },
            {
                id: "4",
                description:
                    "A cabin crew member informs you about a concerning passenger situation.",
                correct: "report",
                explanation:
                    "The expected response is to communicate and coordinate with the cabin crew."
            },
            {
                id: "5",
                description:
                    "A passenger attempts to enter a restricted aircraft area without authorization.",
                correct: "report",
                explanation:
                    "The expected response is to report the unauthorized access to the appropriate crew member."
            }
        ];

        function createSessionScenarios() {
            sessionScenarios = [...scenarios];

            for (let i = sessionScenarios.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));

                [
                    sessionScenarios[i],
                    sessionScenarios[j]
                ] = [
                    sessionScenarios[j],
                    sessionScenarios[i]
                ];
            }
        }

        function selectPassenger(number) {
            if (
                completedScenarios >= scenarios.length ||
                responseInProgress ||
                scenarioActive
            ) {
                return;
            }

            clearInterval(timerInterval);

            currentScenario = sessionScenarios[completedScenarios];
            timeLeft = 30;
            scenarioActive = true;
            scenarioStartTime = Date.now();

            document.getElementById("timer").textContent = timeLeft;

            document.getElementById("scenarioNumber").textContent =
                (completedScenarios + 1) + " / " + scenarios.length;

            const scenarioBox = document.getElementById("scenario");
            scenarioBox.replaceChildren();

            const heading = document.createElement("h2");
            heading.textContent = "Passenger " + number;

            const description = document.createElement("p");
            description.textContent = currentScenario.description;

            const question = document.createElement("h3");
            question.textContent = "What would you do?";

            scenarioBox.append(heading, description, question);

            addDecisionButton(scenarioBox, "Observe", "observe");
            addDecisionButton(scenarioBox, "Report to Crew", "report");
            addDecisionButton(scenarioBox, "Ignore", "ignore");

            startTimer();
        }

        function addDecisionButton(container, label, action) {
            const button = document.createElement("button");

            button.textContent = label;
            button.type = "button";
            button.onclick = () => response(action);

            container.appendChild(button);
        }

        function startTimer() {
            clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (!scenarioActive || responseInProgress) {
                    return;
                }

                timeLeft = Math.max(0, timeLeft - 1);

                document.getElementById("timer").textContent =
                    timeLeft;

                if (timeLeft === 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        async function submitResult(scenario, action, responseTime) {
            try {
                const apiResponse = await fetch(
                    API_BASE + "/evaluate",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            trainee: username,
                            scenario: scenario.id,
                            decision: action,
                            response_time: responseTime
                        })
                    }
                );

                let data = {};

                try {
                    data = await apiResponse.json();
                } catch {
                    data = {};
                }

                if (!apiResponse.ok) {
                    throw new Error(
                        data.error ||
                        "Server returned HTTP " + apiResponse.status
                    );
                }

                return {
                    saved: true,
                    feedback:
                        typeof data.feedback === "string"
                            ? data.feedback
                            : "",
                    result:
                        typeof data.result === "string"
                            ? data.result
                            : ""
                };
            } catch (error) {
                console.error(
                    "Training result could not be saved:",
                    error
                );

                return {
                    saved: false,
                    feedback: "",
                    result: "",
                    error: error.message
                };
            }
        }

        async function response(action) {
            if (
                !currentScenario ||
                responseInProgress ||
                !scenarioActive ||
                completedScenarios >= scenarios.length
            ) {
                return;
            }

            responseInProgress = true;
            scenarioActive = false;
            clearInterval(timerInterval);

            const answeredScenario = currentScenario;

            const responseTime = Math.min(
                30,
                Math.max(
                    0,
                    Math.round((Date.now() - scenarioStartTime) / 1000)
                )
            );

            totalResponseTime += responseTime;

            const isCorrect = action === answeredScenario.correct;

            if (isCorrect) {
                score += 10;
                correctAnswers++;
            } else {
                score = Math.max(0, score - 5);
            }

            document.getElementById("score").textContent = score;

            // Save to the backend, but do not rely on its feedback field.
            const serverResult = await submitResult(
                answeredScenario,
                action,
                responseTime
            );

            const title = isCorrect
                ? "Correct response!"
                : "Needs Improvement";

            // Always use the local explanation as a safe fallback.
            let feedback = isCorrect
                ? answeredScenario.explanation
                : "Your selected action was not the expected response. " +
                  answeredScenario.explanation;

            if (
                serverResult.saved &&
                serverResult.feedback &&
                serverResult.feedback.trim()
            ) {
                // Keep the scenario explanation even if the backend
                // returns a generic or incomplete message.
                feedback = answeredScenario.explanation;
            }

            showFeedback(
                title,
                feedback,
                serverResult.saved,
                responseTime
            );
        }

        async function handleTimeout() {
            if (
                !currentScenario ||
                responseInProgress ||
                !scenarioActive
            ) {
                return;
            }

            responseInProgress = true;
            scenarioActive = false;

            const timedOutScenario = currentScenario;
            totalResponseTime += 30;
            score = Math.max(0, score - 5);

            document.getElementById("score").textContent = score;

            const serverResult = await submitResult(
                timedOutScenario,
                "timeout",
                30
            );

            showFeedback(
                "Time's up!",
                "Time expired. " +
                    timedOutScenario.explanation +
                    " Try to make your decision within the allowed time.",
                serverResult.saved,
                30
            );
        }

        function showFeedback(title, message, saved, responseTime) {
            const scenarioBox = document.getElementById("scenario");
            scenarioBox.replaceChildren();

            const feedbackBox = document.createElement("div");
            feedbackBox.id = "responseFeedback";

            const heading = document.createElement("h3");
            heading.id = "feedbackTitle";
            heading.textContent = title || "Training Feedback";
            heading.className =
                title === "Correct response!" ? "correct" : "incorrect";

            const paragraph = document.createElement("p");

            // Never display the JavaScript value "undefined".
            paragraph.textContent =
                typeof message === "string" && message.trim()
                    ? message
                    : "Review the scenario explanation and continue your training.";

            const timeParagraph = document.createElement("p");
            timeParagraph.textContent =
                "Your response time: " + responseTime + " seconds.";

            const saveStatus = document.createElement("p");
            saveStatus.id = "saveStatus";
            saveStatus.textContent = saved
                ? "Training result saved to the server."
                : "Could not save this result to the server. You can continue training.";

            const continueButton = document.createElement("button");
            continueButton.type = "button";
            continueButton.textContent =
                completedScenarios + 1 >= scenarios.length
                    ? "View Final Results"
                    : "Continue to Next Scenario";

            continueButton.onclick = continueTraining;

            feedbackBox.append(
                heading,
                paragraph,
                timeParagraph,
                saveStatus,
                continueButton
            );

            scenarioBox.appendChild(feedbackBox);
        }

        function continueTraining() {
            if (!responseInProgress) {
                return;
            }

            completedScenarios++;
            responseInProgress = false;
            currentScenario = null;

            if (completedScenarios >= scenarios.length) {
                finishTraining();
                return;
            }

            document.getElementById("scenarioNumber").textContent =
                (completedScenarios + 1) + " / " + scenarios.length;

            document.getElementById("timer").textContent = "30";

            const scenarioBox = document.getElementById("scenario");
            scenarioBox.replaceChildren();

            const heading = document.createElement("h2");
            heading.textContent = "Next Scenario";

            const paragraph = document.createElement("p");
            paragraph.textContent =
                "Select a passenger to continue your training.";

            scenarioBox.append(heading, paragraph);
        }

        function finishTraining() {
            clearInterval(timerInterval);

            const averageResponseTime = Math.round(
                totalResponseTime / scenarios.length
            );

            // Maximum score is 50; the score cannot go below zero.
            const percentage = Math.round(
                (score / (scenarios.length * 10)) * 100
            );

            let performance;

            if (percentage >= 80) {
                performance = "Excellent";
            } else if (percentage >= 60) {
                performance = "Good";
            } else if (percentage >= 40) {
                performance = "Needs Improvement";
            } else {
                performance = "Requires Further Training";
            }

            document.getElementById("scenarioNumber").textContent =
                "Complete";

            document.getElementById("timer").textContent = "0";

            const trainingResult = {
                username: username,
                score: score,
                completed: completedScenarios,
                correct: correctAnswers,
                averageTime: averageResponseTime,
                performance: performance,
                feedback:
                    "Continue practicing situational awareness, decision-making and response time."
            };

            localStorage.setItem(
                "trainingResult",
                JSON.stringify(trainingResult)
            );

            const scenarioBox = document.getElementById("scenario");
            scenarioBox.replaceChildren();

            addText(scenarioBox, "h2", "Training Completed");
            addText(scenarioBox, "p", "Trainee: " + username);
            addText(
                scenarioBox,
                "p",
                "Scenarios Completed: " +
                    completedScenarios + " / " + scenarios.length
            );
            addText(
                scenarioBox,
                "p",
                "Final Score: " + score + " / " +
                    (scenarios.length * 10)
            );
            addText(
                scenarioBox,
                "p",
                "Correct Decisions: " +
                    correctAnswers + " / " + scenarios.length
            );
            addText(
                scenarioBox,
                "p",
                "Average Response Time: " +
                    averageResponseTime + " seconds"
            );
            addText(
                scenarioBox,
                "p",
                "Performance: " + performance
            );

            addText(scenarioBox, "h3", "Training Feedback");
            addText(scenarioBox, "p", trainingResult.feedback);

            const dashboardButton = document.createElement("button");
            dashboardButton.textContent = "View Performance Dashboard";
            dashboardButton.onclick = () => {
                window.location.href = "dashboard.html";
            };

            const retryButton = document.createElement("button");
            retryButton.textContent = "Train Again";
            retryButton.onclick = () => {
                window.location.reload();
            };

            scenarioBox.append(dashboardButton, retryButton);
        }

        function addText(container, tag, value) {
            const element = document.createElement(tag);
            element.textContent = value;
            container.appendChild(element);
        }

        createSessionScenarios();
    </script>
</body>
</html>
