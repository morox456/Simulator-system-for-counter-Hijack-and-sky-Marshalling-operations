
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Marshal Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="simulator-container">
        <h1>Virtual Aircraft Simulator</h1>
        <p id="welcome"></p>

        <div class="stats">
            <div><strong>Score</strong><span id="score">0</span></div>
            <div><strong>Scenario</strong><span id="scenarioNumber">1 / 5</span></div>
            <div><strong>Time</strong><span><span id="timer">30</span>s</span></div>
        </div>

        <div class="aircraft">
            <div class="passenger" onclick="selectPassenger(1)">P1</div>
            <div class="passenger" onclick="selectPassenger(2)">P2</div>
            <div class="passenger" onclick="selectPassenger(3)">P3</div>
            <div class="passenger" onclick="selectPassenger(4)">P4</div>
            <div class="passenger" onclick="selectPassenger(5)">P5</div>
            <div class="passenger" onclick="selectPassenger(6)">P6</div>
            <div class="crew">CREW</div>
            <div class="marshal">SKY MARSHAL</div>
        </div>

        <div id="scenario">
            <h2>Scenario</h2>
            <p>Select a passenger to begin the simulation.</p>
        </div>
    </div>

    <script>
        const API_BASE = "https://sky-marshal-backend.onrender.com/api";

        const username = localStorage.getItem("username") || "Guest";
        document.getElementById("welcome").textContent = "Welcome, " + username;

        let score = 0;
        let scenarioCount = 1;
        let timeLeft = 30;
        let timerInterval = null;
        let currentScenario = null;
        let sessionScenarios = [];
        let completedScenarios = 0;
        let correctAnswers = 0;
        let totalResponseTime = 0;
        let scenarioStartTime = 0;
        let responseInProgress = false;

        const scenarios = [
            {
                id: "1",
                description: "A passenger is repeatedly looking around the cabin and behaving unusually.",
                correct: "observe",
                explanation: "The trainee should first observe and assess the situation."
            },
            {
                id: "2",
                description: "A passenger reports unusual behavior from another passenger.",
                correct: "report",
                explanation: "Communicate the report to the crew for further assessment."
            },
            {
                id: "3",
                description: "A passenger appears nervous and repeatedly checks their surroundings.",
                correct: "observe",
                explanation: "Observe the situation first rather than causing unnecessary alarm."
            },
            {
                id: "4",
                description: "Cabin crew informs you about a suspicious situation involving a passenger.",
                correct: "report",
                explanation: "Communicate with the crew to support coordinated assessment."
            },
            {
                id: "5",
                description: "A passenger attempts to enter a restricted aircraft area without authorization.",
                correct: "report",
                explanation: "Report the situation to the appropriate crew member."
            }
        ];

        function createSessionScenarios() {
            sessionScenarios = [...scenarios];

            for (let i = sessionScenarios.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [sessionScenarios[i], sessionScenarios[j]] =
                    [sessionScenarios[j], sessionScenarios[i]];
            }
        }

        createSessionScenarios();

        function selectPassenger(number) {
            if (completedScenarios >= scenarios.length || responseInProgress) return;

            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById("timer").textContent = timeLeft;

            currentScenario = sessionScenarios[completedScenarios];
            scenarioStartTime = Date.now();
            responseInProgress = false;

            document.getElementById("scenario").innerHTML = `
                <h2>Passenger ${number}</h2>
                <p>${currentScenario.description}</p>
                <h3>What would you do?</h3>
                <button onclick="response('observe')">Observe</button>
                <button onclick="response('report')">Report to Crew</button>
                <button onclick="response('ignore')">Ignore</button>
            `;

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);

            timerInterval = setInterval(async () => {
                timeLeft--;
                document.getElementById("timer").textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);

                    if (responseInProgress || !currentScenario) return;
                    responseInProgress = true;

                    const timedOutScenario = currentScenario;
                    totalResponseTime += 30;

                    showFeedback(
                        "Time's up!",
                        "Your response time expired. Review the scenario and try to make your decision within the time limit."
                    );

                    await submitResult(timedOutScenario, "timeout", 30);

                    completedScenarios++;
                    responseInProgress = false;
                    nextScenario();
                }
            }, 1000);
        }

        async function submitResult(scenario, action, responseTime) {
            try {
                const apiResponse = await fetch(`${API_BASE}/evaluate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        trainee: username,
                        scenario: scenario.id,
                        decision: action,
                        response_time: responseTime
                    })
                });

                const data = await apiResponse.json();

                if (!apiResponse.ok) {
                    throw new Error(data.error || `Server error (${apiResponse.status})`);
                }

                return data;
            } catch (error) {
                console.error("Could not save training result:", error);
                return {
                    result: action === scenario.correct ? "Correct" : "Needs Improvement",
                    score: action === scenario.correct ? 10 : 0,
                    feedback: "The local simulation continued, but this result could not be saved to the server. Check the Render backend."
                };
            }
        }

        
async function response(action) {
    if (
        !currentScenario ||
        responseInProgress ||
        completedScenarios >= scenarios.length
    ) {
        return;
    }

    responseInProgress = true;
    clearInterval(timerInterval);

    const answeredScenario = currentScenario;

    const responseTime = Math.min(
        30,
        Math.max(
            0,
            Math.round((Date.now() - scenarioStartTime) / 1000)
        )
    );

    totalResponseTime += responseTime;

    let result = {};

    try {
        result = await submitResult(
            answeredScenario,
            action,
            responseTime
        );

        if (!result || typeof result !== "object") {
            result = {};
        }
    } catch (error) {
        console.error("Could not submit training result:", error);
        result = {};
    }

    // Use the scenario's existing expected-action information
    // if the backend response does not provide a result.
    const expectedAction =
        answeredScenario.correctAction ??
        answeredScenario.correct ??
        answeredScenario.answer;

    const isCorrect =
        result.result === "Correct" ||
        (
            !result.result &&
            typeof expectedAction === "string" &&
            action.toLowerCase() === expectedAction.toLowerCase()
        );

    if (isCorrect) {
        score += 10;
        correctAnswers++;
    } else {
        score = Math.max(0, score - 5);
    }

    document.getElementById("score").textContent = score;

    const title = isCorrect
        ? "Correct response!"
        : "Needs Improvement";

    const feedback =
        result.feedback ||
        result.message ||
        answeredScenario.explanation ||
        (
            isCorrect
                ? "Good decision for this simulated scenario."
                : "Review the scenario and try to choose the expected response."
        );

    showFeedback(title, feedback);

    completedScenarios++;
    responseInProgress = false;

    nextScenario();
}


        function showFeedback(title, message) {
            const oldFeedback = document.getElementById("responseFeedback");
            if (oldFeedback) oldFeedback.remove();

            const feedbackBox = document.createElement("div");
            feedbackBox.id = "responseFeedback";

            const heading = document.createElement("h3");
            heading.textContent = title;

            const paragraph = document.createElement("p");
            paragraph.textContent = message || "Review the scenario and continue training.";

            feedbackBox.appendChild(heading);
            feedbackBox.appendChild(paragraph);

            const scenarioBox = document.getElementById("scenario");
            scenarioBox.appendChild(feedbackBox);
        }

        function nextScenario() {
            if (completedScenarios >= scenarios.length) {
                finishTraining();
                return;
            }

            scenarioCount++;
            document.getElementById("scenarioNumber").textContent =
                scenarioCount + " / " + scenarios.length;

            document.getElementById("scenario").innerHTML = `
                <h2>Next Scenario</h2>
                <p>Select another passenger to continue training.</p>
            `;
        }

        function finishTraining() {
            clearInterval(timerInterval);

            const averageResponseTime = Math.round(
                totalResponseTime / scenarios.length
            );
            const percentage = Math.round((score / 50) * 100);

            let performance;
            if (percentage >= 80) performance = "Excellent";
            else if (percentage >= 60) performance = "Good";
            else if (percentage >= 40) performance = "Needs Improvement";
            else performance = "Requires Further Training";

            document.getElementById("scenarioNumber").textContent = "Complete";
            document.getElementById("timer").textContent = "0";

            const trainingResult = {
                username,
                score,
                completed: completedScenarios,
                correct: correctAnswers,
                averageTime: averageResponseTime,
                performance,
                feedback: "Continue practicing situational awareness, decision-making and response time."
            };

            localStorage.setItem("trainingResult", JSON.stringify(trainingResult));

            document.getElementById("scenario").innerHTML = `
                <h2>Training Completed</h2>
                <p><strong>Trainee:</strong> ${escapeHTML(username)}</p>
                <p><strong>Scenarios Completed:</strong> ${completedScenarios} / ${scenarios.length}</p>
                <p><strong>Final Score:</strong> ${score} / 50</p>
                <p><strong>Correct Decisions:</strong> ${correctAnswers} / ${scenarios.length}</p>
                <p><strong>Average Response Time:</strong> ${averageResponseTime} seconds</p>
                <p><strong>Performance:</strong> ${performance}</p>
                <h3>Training Feedback</h3>
                <p>${trainingResult.feedback}</p>
                <button onclick="window.location.href='dashboard.html'">
                    View Performance Dashboard
                </button>
                <button onclick="window.location.reload()">
                    Train Again
                </button>
            `;
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }
    </script>
</body>
</html>
