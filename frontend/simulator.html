
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Marshal Simulator</title>
    <link rel="stylesheet" href="style.css">

    <style>
        #responseFeedback {
            margin-top: 20px;
            padding: 18px;
            border-radius: 10px;
            background: #1d2a38;
            border-left: 5px solid #2196f3;
            color: white;
        }

        #responseFeedback h3 {
            margin-top: 0;
        }

        #responseFeedback p {
            line-height: 1.6;
        }

        #continueButton {
            margin-top: 10px;
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            background: #2196f3;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #saveStatus {
            font-size: 13px;
            color: #b8c7d9;
        }
    </style>
</head>

<body>
    <div class="simulator-container">
        <h1>Virtual Aircraft Simulator</h1>
        <p id="welcome"></p>

        <div class="stats">
            <div>
                <strong>Score</strong>
                <span id="score">0</span>
            </div>
            <div>
                <strong>Scenario</strong>
                <span id="scenarioNumber">1 / 5</span>
            </div>
            <div>
                <strong>Time</strong>
                <span><span id="timer">30</span>s</span>
            </div>
        </div>

        <div class="aircraft">
            <div class="passenger" onclick="selectPassenger(1)">P1</div>
            <div class="passenger" onclick="selectPassenger(2)">P2</div>
            <div class="passenger" onclick="selectPassenger(3)">P3</div>
            <div class="passenger" onclick="selectPassenger(4)">P4</div>
            <div class="passenger" onclick="selectPassenger(5)">P5</div>
            <div class="passenger" onclick="selectPassenger(6)">P6</div>
            <div class="crew">CREW</div>
            <div class="marshal">SKY MARSHAL</div>
        </div>

        <div id="scenario">
            <h2>Scenario</h2>
            <p>Select a passenger to begin the simulation.</p>
        </div>
    </div>

    <script>
        const API_BASE =
            "https://sky-marshal-backend.onrender.com/api";

        const username =
            localStorage.getItem("username") || "Guest";

        document.getElementById("welcome").textContent =
            "Welcome, " + username;

        let score = 0;
        let timeLeft = 30;
        let timerInterval = null;
        let currentScenario = null;
        let sessionScenarios = [];
        let completedScenarios = 0;
        let correctAnswers = 0;
        let totalResponseTime = 0;
        let scenarioStartTime = 0;
        let responseInProgress = false;
        let scenarioActive = false;

        const scenarios = [
            {
                id: "1",
                description:
                    "A passenger is repeatedly looking around the cabin and behaving unusually.",
                correct: "observe",
                explanation:
                    "The expected response is to observe and assess the situation carefully. Unusual behavior alone does not prove wrongdoing."
            },
            {
                id: "2",
                description:
                    "A passenger reports unusual behavior from another passenger.",
                correct: "report",
                explanation:
                    "The expected response is to communicate the report to the cabin crew for appropriate assessment."
            },
            {
                id: "3",
                description:
                    "A passenger appears nervous and repeatedly checks their surroundings.",
                correct: "observe",
                explanation:
                    "The expected response is to observe the situation without making assumptions based only on nervous behavior."
            },
            {
                id: "4",
                description:
                    "Cabin crew informs you about a suspicious situation involving a passenger.",
                correct: "report",
                explanation:
                    "The expected response is to communicate and coordinate with the crew."
            },
            {
                id: "5",
                description:
                    "A passenger attempts to enter a restricted aircraft area without authorization.",
                correct: "report",
                explanation:
                    "The expected response is to report the unauthorized access to the appropriate crew member."
            }
        ];

        function createSessionScenarios() {
            sessionScenarios = [...scenarios];

            for (let i = sessionScenarios.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));

                [sessionScenarios[i], sessionScenarios[j]] =
                    [sessionScenarios[j], sessionScenarios[i]];
            }
        }

        createSessionScenarios();

        function selectPassenger(number) {
            if (
                completedScenarios >= scenarios.length ||
                responseInProgress ||
                scenarioActive
            ) {
                return;
            }

            clearInterval(timerInterval);

            currentScenario = sessionScenarios[completedScenarios];
            timeLeft = 30;
            scenarioActive = true;
            scenarioStartTime = Date.now();

            document.getElementById("timer").textContent = timeLeft;
            document.getElementById("scenarioNumber").textContent =
                (completedScenarios + 1) + " / " + scenarios.length;

            document.getElementById("scenario").innerHTML = `
                <h2>Passenger ${number}</h2>
                <p>${escapeHTML(currentScenario.description)}</p>
                <h3>What would you do?</h3>
                <button onclick="response('observe')">Observe</button>
                <button onclick="response('report')">Report to Crew</button>
                <button onclick="response('ignore')">Ignore</button>
            `;

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (!scenarioActive || responseInProgress) {
                    return;
                }

                timeLeft--;

                document.getElementById("timer").textContent =
                    Math.max(0, timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        async function submitResult(scenario, action, responseTime) {
            try {
                const apiResponse = await fetch(
                    `${API_BASE}/evaluate`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            trainee: username,
                            scenario: scenario.id,
                            decision: action,
                            response_time: responseTime
                        })
                    }
                );

                let data = {};

                try {
                    data = await apiResponse.json();
                } catch {
                    data = {};
                }

                if (!apiResponse.ok) {
                    throw new Error(
                        data.error ||
                        `Server returned HTTP ${apiResponse.status}`
                    );
                }

                return {
                    saved: true,
                    feedback:
                        typeof data.feedback === "string"
                            ? data.feedback
                            : "",
                    result:
                        typeof data.result === "string"
                            ? data.result
                            : ""
                };
            } catch (error) {
                console.error("Training result could not be saved:", error);

                return {
                    saved: false,
                    feedback: "",
                    result: "",
                    error: error.message
                };
            }
        }

        async function response(action) {
            if (
                !currentScenario ||
                responseInProgress ||
                !scenarioActive ||
                completedScenarios >= scenarios.length
            ) {
                return;
            }

            responseInProgress = true;
            scenarioActive = false;
            clearInterval(timerInterval);

            const answeredScenario = currentScenario;

            const responseTime = Math.min(
                30,
                Math.max(
                    0,
                    Math.round(
                        (Date.now() - scenarioStartTime) / 1000
                    )
                )
            );

            totalResponseTime += responseTime;

            // The scenario's expected action is the local reference
            // for scoring. The backend stores the submitted decision.
            const isCorrect = action === answeredScenario.correct;

            if (isCorrect) {
                score += 10;
                correctAnswers++;
            } else {
                score = Math.max(0, score - 5);
            }

            document.getElementById("score").textContent = score;

            const serverResult = await submitResult(
                answeredScenario,
                action,
                responseTime
            );

            let title;
            let feedback;

            if (isCorrect) {
                title = "Correct response!";
                feedback = answeredScenario.explanation;
            } else {
                title = "Needs Improvement";
                feedback =
                    "Your selected action was not the expected response. " +
                    answeredScenario.explanation;
            }

            // Use backend feedback if it is a valid non-empty string.
            if (
                serverResult.saved &&
                typeof serverResult.feedback === "string" &&
                serverResult.feedback.trim() !== ""
            ) {
                feedback = serverResult.feedback;
            }

            showFeedback(
                title,
                feedback,
                serverResult.saved,
                responseTime
            );
        }

        async function handleTimeout() {
            if (
                !currentScenario ||
                responseInProgress ||
                !scenarioActive
            ) {
                return;
            }

            responseInProgress = true;
            scenarioActive = false;

            const timedOutScenario = currentScenario;
            totalResponseTime += 30;

            const serverResult = await submitResult(
                timedOutScenario,
                "timeout",
                30
            );

            score = Math.max(0, score - 5);

            document.getElementById("score").textContent = score;

            const message =
                "Time expired. " +
                timedOutScenario.explanation +
                " Try to make your decision within the allowed time.";

            showFeedback(
                "Time's up!",
                message,
                serverResult.saved,
                30
            );
        }

        function showFeedback(title, message, saved, responseTime) {
            const scenarioBox = document.getElementById("scenario");

            scenarioBox.innerHTML = "";

            const feedbackBox = document.createElement("div");
            feedbackBox.id = "responseFeedback";

            const heading = document.createElement("h3");
            heading.textContent = title || "Training Feedback";

            const paragraph = document.createElement("p");
            paragraph.textContent =
                typeof message === "string" && message.trim()
                    ? message
                    : "Review the scenario and continue your training.";

            const timeParagraph = document.createElement("p");
            timeParagraph.textContent =
                "Your response time: " + responseTime + " seconds.";

            const saveStatus = document.createElement("p");
            saveStatus.id = "saveStatus";
            saveStatus.textContent = saved
                ? "Training result saved to the server."
                : "Result could not be saved to the server. Your local simulation can continue.";

            const continueButton = document.createElement("button");
            continueButton.id = "continueButton";
            continueButton.textContent =
                completedScenarios + 1 >= scenarios.length
                    ? "View Final Results"
                    : "Continue to Next Scenario";

            continueButton.onclick = continueTraining;

            feedbackBox.appendChild(heading);
            feedbackBox.appendChild(paragraph);
            feedbackBox.appendChild(timeParagraph);
            feedbackBox.appendChild(saveStatus);
            feedbackBox.appendChild(continueButton);

            scenarioBox.appendChild(feedbackBox);
        }

        function continueTraining() {
            if (!responseInProgress) {
                return;
            }

            completedScenarios++;
            responseInProgress = false;
            currentScenario = null;

            if (completedScenarios >= scenarios.length) {
                finishTraining();
                return;
            }

            document.getElementById("scenarioNumber").textContent =
                (completedScenarios + 1) + " / " + scenarios.length;

            document.getElementById("timer").textContent = "30";

            document.getElementById("scenario").innerHTML = `
                <h2>Next Scenario</h2>
                <p>Select a passenger to continue your training.</p>
            `;
        }

        function finishTraining() {
            clearInterval(timerInterval);

            const averageResponseTime = Math.round(
                totalResponseTime / scenarios.length
            );

            const percentage = Math.round(
                (score / (scenarios.length * 10)) * 100
            );

            let performance;

            if (percentage >= 80) {
                performance = "Excellent";
            } else if (percentage >= 60) {
                performance = "Good";
            } else if (percentage >= 40) {
                performance = "Needs Improvement";
            } else {
                performance = "Requires Further Training";
            }

            document.getElementById("scenarioNumber").textContent =
                "Complete";

            document.getElementById("timer").textContent = "0";

            const trainingResult = {
                username: username,
                score: score,
                completed: completedScenarios,
                correct: correctAnswers,
                averageTime: averageResponseTime,
                performance: performance,
                feedback:
                    "Continue practicing situational awareness, " +
                    "decision-making and response time."
            };

            localStorage.setItem(
                "trainingResult",
                JSON.stringify(trainingResult)
            );

            document.getElementById("scenario").innerHTML = `
                <h2>Training Completed</h2>
                <p><strong>Trainee:</strong> ${escapeHTML(username)}</p>
                <p><strong>Scenarios Completed:</strong>
                    ${completedScenarios} / ${scenarios.length}</p>
                <p><strong>Final Score:</strong>
                    ${score} / ${scenarios.length * 10}</p>
                <p><strong>Correct Decisions:</strong>
                    ${correctAnswers} / ${scenarios.length}</p>
                <p><strong>Average Response Time:</strong>
                    ${averageResponseTime} seconds</p>
                <p><strong>Performance:</strong>
                    ${escapeHTML(performance)}</p>
                <h3>Training Feedback</h3>
                <p>${escapeHTML(trainingResult.feedback)}</p>
                <button onclick="window.location.href='dashboard.html'">
                    View Performance Dashboard
                </button>
                <button onclick="window.location.reload()">
                    Train Again
                </button>
            `;
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }
    </script>
</body>
</html>
